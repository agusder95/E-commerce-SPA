#version: '3.8'

services:
  # 1. API (.NET)
  paymentgateway-api:
    build:
      context: .
      dockerfile: PaymentGateway.API/Dockerfile
    container_name: paymentgateway-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # IMPORTANTE: Aquí conectamos usando el nombre del servicio en el compose
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=${POSTGRES_DB:-Order_Customer};Username=${POSTGRES_USER:-paymentgateway};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};
      - ConnectionStrings__RedisConnection=redis-cache:6379
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started

  # 2. Base de Datos (PostgreSQL)
  postgres-db:
    image: postgres:17
    container_name: paymentgateway-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-Order_Customer}
      - POSTGRES_USER=${POSTGRES_USER:-paymentgateway}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Caché (Redis)
  redis-cache:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

# Volúmenes para que los datos sobrevivan al apagar Docker
volumes:
  postgres-data:
  redis-data:
